<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ubuntu 更新中</title>
<style>*{margin:0;padding:0;box-sizing:border-box}
body{background:#2c001e;width:100vw;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Ubuntu','DejaVu Sans',sans-serif;color:#fff;overflow:hidden}
.ubu-logo{width:64px;margin-bottom:36px;border-radius:50%;border:3px solid #dd4814;padding:8px}
.ubu-logo svg{display:block;width:100%;height:auto}
.title{font-size:18px;margin-bottom:22px;font-weight:300}
.bar-wrap{width:320px;height:6px;background:#5a002a;border-radius:3px}
.bar-inner{height:100%;width:0%;background:#dd4814;border-radius:3px;animation:prog 15s ease-in-out infinite}
@keyframes prog{0%{width:0%}40%{width:55%}80%{width:85%}100%{width:94%}}
.sub{margin-top:14px;font-size:12px;color:#ff8866}
.lines{margin-top:10px;font-family:'Ubuntu Mono',monospace;font-size:11px;color:#cc7755;text-align:left;width:360px;line-height:1.6;height:120px;overflow:hidden}
</style></head>
<body>
<div class="ubu-logo">
<svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="15" fill="#dd4814"/><circle cx="16" cy="16" r="12" fill="#fff"/><circle cx="16" cy="16" r="4" fill="#dd4814"/><circle cx="9" cy="9" r="3" fill="#77216f"/><circle cx="23" cy="23" r="3" fill="#77216f"/><circle cx="24" cy="9" r="2" fill="#5E2750"/><circle cx="8" cy="23" r="2" fill="#5E2750"/></svg>
</div>
<div class="title" id="title"></div>
<div class="bar-wrap"><div class="bar-inner"></div></div>
<div class="sub"><span id="subLabel"></span> (<span id="pct">0</span>%)</div>
<div class="lines" id="lines"></div>
<script>var lang=new URLSearchParams(window.location.search).get('lang')||'zh';
document.getElementById('title').textContent=lang==='en'?'Installing system updates — Do not turn off the power':'正在安装系统更新 — 请勿关闭电源';
document.getElementById('subLabel').textContent=lang==='en'?'Installing updates':'正在安装更新';
document.title=lang==='en'?'Ubuntu Updating':'Ubuntu 更新中';
var n=0,pkgs=['linux-image-generic','libssl1.1','firefox','snapd','gnome-shell','systemd','apt','dpkg'];var li=0;setInterval(function(){n=n<97?n+Math.floor(Math.random()*1+1):97;document.getElementById('pct').textContent=n;if(Math.random()>.6){var d=document.getElementById('lines');var t='Setting up '+pkgs[li%pkgs.length]+' ('+(Math.floor(Math.random()*900)+100)+'kB) ...';d.innerHTML+='<div>'+t+'</div>';li++;if(d.children.length>6)d.removeChild(d.firstChild)}},700)</script>
</body></html>
