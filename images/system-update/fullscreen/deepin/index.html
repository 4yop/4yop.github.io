<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Deepin Updates</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1a237e 0%, #283593 50%, #1565c0 100%);
            font-family: 'Noto Sans CJK SC', Arial, sans-serif;
            width: 100vw;
            height: 100vh;
            color: #fff;
            user-select: none;
            position: fixed;
            text-align: center;
            cursor: none;
        }
        .center {
            position: absolute;
            width: 500px;
            height: 450px;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }
        .logo {
            width: 110px;
            height: 110px;
            margin: 0 auto 25px;
            background: rgba(255,255,255,0.15);
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            font-weight: bold;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            animation: glow 3s ease-in-out infinite;
        }
        @keyframes glow {
            0%, 100% { box-shadow: 0 8px 32px rgba(33,150,243,0.5); }
            50% { box-shadow: 0 8px 32px rgba(33,150,243,1); }
        }
        h1 {
            font-size: 40px;
            font-weight: 500;
            margin-bottom: 12px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        .loader-container {
            margin: 30px auto;
            width: 380px;
        }
        .dots {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
        }
        .dot {
            width: 12px;
            height: 12px;
            background: #fff;
            border-radius: 50%;
            animation: wave 1.4s ease-in-out infinite;
        }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes wave {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.5; }
            40% { transform: scale(1); opacity: 1; }
        }
        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.2);
            border-radius: 3px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #42a5f5, #66bb6a);
            transition: width 0.4s ease;
        }
        .percentage {
            font-size: 34px;
            margin-top: 18px;
            font-weight: 300;
        }
        .message {
            color: rgba(255,255,255,0.85);
            font-size: 16px;
            margin-top: 25px;
        }
    </style>
</head>
<body>
    <div class="center">
        <div class="logo">D</div>
        <h1>Deepin 20</h1>
        <p style="color:rgba(255,255,255,0.9); font-size:18px;">正在更新系统组件</p>
        
        <div class="loader-container">
            <div class="dots">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progress" style="width: 29%"></div>
            </div>
        </div>
        
        <div class="percentage" id="timer">29%</div>
        <div class="message">系统更新中，请稍候</div>
    </div>

    <script>
        var count = 28;
        var counter = setInterval(timer, 1150);

        function timer() {
            count = count + 1;
            if (count > 100) count = 1;

            document.getElementById('timer').innerHTML = count + '%';
            document.getElementById('progress').style.width = count + '%';
        }

        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });
    </script>
</body>
</html>
