<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Windows Vista Updates</title>
    <style>
        body {
            background: url(vista_bg.jpg) #1a3a6e no-repeat center center fixed;
            user-select: none;
            -moz-user-select: none;
            -webkit-user-select: none;
            -ms-user-select: none;
            -webkit-background-size: cover;
            -moz-background-size: cover;
            -o-background-size: cover;
            background-size: cover;
            vertical-align: middle;
            text-align: center;
            z-index: -1;
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            position: fixed;
            cursor: none;
        }
        .CT {
            vertical-align: middle;
            position: absolute;
            top: 60%;
            height: 70px;
            margin-left: auto;
            margin-right: auto;
            display: block;
            width: 520px;
            margin-top: -5%;
            font-family: Segoe UI, Arial;
            font-size: 20px;
            color: #fff;
            font-weight: normal;
            text-align: right;
        }
        .image_block {
            position: absolute;
            bottom: 50px;
            left: 50%;
            width: 50%;
            margin: -5% 0 0 -25%;
        }
        .centeragain {
            width: 520px;
            margin: 0px auto;
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="centeragain">
        <div class="CT">
            <div class="image_block">
                <img src="vista_logo.png" alt="Windows Vista Logo">
            </div>
            <div>
                <a id="ref"><br><span>正在安装 Windows 更新...</span></a>
                <a id="timer">15%</a>
                <br>
                <span>请不要关闭您的计算机或拔掉电源</span>
            </div>
        </div>
    </div>

    <script>
        var count = 14;
        var counter = setInterval(timer, 1000);

        function timer() {
            count = count + 1;
            if (count > 100) {
                count = 1;
            }
            document.getElementById('timer').innerHTML = count + '%';
        }

        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });
    </script>
</body>
</html>
