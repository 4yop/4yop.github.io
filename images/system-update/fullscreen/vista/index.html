<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Windows Vista 更新中</title>
<style>*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(180deg,#1a3a6a 0%,#0a1a4a 100%);width:100vw;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Segoe UI','Microsoft YaHei',sans-serif;color:#fff;overflow:hidden}
.title{font-size:22px;margin-bottom:25px;font-weight:300}
.bar-wrap{width:360px;height:8px;background:#2a4a7a;border-radius:4px}
.bar-inner{height:100%;width:0%;background:#5a9ae0;border-radius:4px;animation:prog 10s ease-in-out infinite}
@keyframes prog{0%{width:0%}50%{width:68%}100%{width:93%}}
.sub{margin-top:16px;font-size:13px;color:#88aadd}
</style></head>
<body>
<div class="title">正在安装更新 — 请勿关闭计算机</div>
<div class="bar-wrap"><div class="bar-inner"></div></div>
<div class="sub">第 1 步，共 3 步</div>
</body></html>
