<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>系统更新中</title>
<style>*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);width:100vw;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Segoe UI','Noto Sans SC',sans-serif;color:#e0e0e0;overflow:hidden}
.gear{width:56px;margin-bottom:24px;animation:spin 3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.title{font-size:20px;margin-bottom:20px;font-weight:300;color:#90caf9}
.bar-wrap{width:320px;height:5px;background:#2a3a5a;border-radius:3px}
.bar-inner{height:100%;width:0%;background:linear-gradient(90deg,#42a5f5,#66bb6a,#ab47bc);border-radius:3px;animation:prog 14s ease-in-out infinite}
@keyframes prog{0%{width:0%}40%{width:55%}75%{width:80%}100%{width:94%}}
.sub{margin-top:14px;font-size:12.5px;color:#8aa4c8}
.dots{margin-top:18px;font-size:22px;letter-spacing:6px;color:#5c7c98}
.dots span{animation:bink 1.5s infinite}
.dots span:nth-child(2){animation-delay:.2s}
.dots span:nth-child(3){animation-delay:.4s}
@keyframes bink{0%,100%{opacity:.2}50%;opacity:1}}
</style></head>
<body>
