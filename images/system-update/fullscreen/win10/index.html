<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Windows 10 更新中</title>
<style>*{margin:0;padding:0;box-sizing:border-box}
body{background:#0078d7;width:100vw;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Segoe UI',sans-serif;color:#fff;overflow:hidden}
.win-logo{width:72px;margin-bottom:36px}
.title{font-size:20px;margin-bottom:22px;font-weight:400}
.bar-wrap{width:340px;height:4px;background:#1a6ab5;border-radius:2px}
.bar-inner{height:100%;width:0%;background:#fff;border-radius:2px;animation:prog 12s ease-in-out infinite}
@keyframes prog{0%{width:0%}50%{width:64%}100%{width:92%}}
.sub{margin-top:14px;font-size:13px;color:#aaddff}
.spinner{width:24px;height:24px;border:2.5px solid #2a7ab5;border-top-color:#fff;border-radius:50%;margin-top:16px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style></head>
<body>
<svg class="win-logo" viewBox="0 0 88 88" fill="#fff"><path d="M42 10L14 16v30l28 4V10zm2 0v41l30-4V17L44 10zM14 48l28 4v27L14 72V48zm30 4l30-5v26L44 79V52z"/></svg>
<div class="title">正在配置 Windows 更新 — 请勿关闭电脑</div>
<div class="bar-wrap"><div class="bar-inner"></div></div>
<div class="sub">已完成 <span id="pct">0</span%</div>
<div class="spinner"></div>
<script>var n=0;setInterval(function(){n=n<95?n+Math.floor(Math.random()*2+1):95;document.getElementById('pct').textContent=n},550)</script>
</body></html>
