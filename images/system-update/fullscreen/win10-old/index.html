<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Windows 10 (Old)</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            font-family: Segoe UI;
            width: 100vw;
            height: 100vh;
            color: #fff;
            user-select: none;
            position: fixed;
            text-align: center;
            cursor: none;
        }
        .center {
            position: absolute;
            width: 500px;
            height: 450px;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }
        h1 {
            font-size: 48px;
            font-weight: 300;
            font-family: Segoe UI Light, Segoe UI;
            margin-bottom: 20px;
        }
        .spinner {
            width: 80px;
            height: 80px;
            margin: 30px auto;
            border: 6px solid #333;
            border-top: 6px solid #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .percentage {
            font-size: 36px;
            margin-top: 20px;
            color: #fff;
        }
        .message {
            color: #888;
            font-size: 18px;
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <div class="center">
        <h1>Windows 10</h1>
        <p style="color:#777; font-size:20px;">正在配置 Windows 更新</p>
        <div class="spinner"></div>
        <div class="percentage" id="timer">52%</div>
        <div class="message">请勿关闭电脑</div>
    </div>

    <script>
        var count = 51;
        var counter = setInterval(timer, 1300);

        function timer() {
            count = count + 1;
            if (count > 100) count = 1;

            document.getElementById('timer').innerHTML = count + '%';
        }

        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });
    </script>
</body>
</html>
