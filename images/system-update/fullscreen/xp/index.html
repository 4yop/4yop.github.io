<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Windows XP 更新中</title>
<style>*{margin:0;padding:0;box-sizing:border-box}
body{background:#0055aa;width:100vw;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Microsoft YaHei',Tahoma,sans-serif;color:#fff;overflow:hidden}
.title{font-size:24px;margin-bottom:30px;font-weight:normal}
.bar-wrap{width:320px;height:18px;background:#1a4a7a;border-radius:3px;border:2px solid #3a7ac0;padding:2px}
.bar-inner{height:100%;width:0%;background:linear-gradient(90deg,#2a6ab0,#5a9ae0);border-radius:2px;animation:prog 8s ease-in-out infinite}
@keyframes prog{0%{width:0%}50%{width:70%}100%{width:92%}}
.pct{margin-top:12px;font-size:13px;color:#aaddff}
</style></head>
<body>
<div class="title" id="title"></div>
<div class="bar-wrap"><div class="bar-inner"></div></div>
<div class="pct"><span id="pctLabel"></span> <span id="pct">0</span>%</div>
<script>var lang=new URLSearchParams(window.location.search).get('lang')||'zh';
var t=lang==='en'?'Configuring updates. Do not turn off your computer.':'正在配置更新。请勿关闭计算机。';
var p=lang==='en'?'Complete':'已完成';
document.getElementById('title').textContent=t;
document.getElementById('pctLabel').textContent=p;
document.title=lang==='en'?'Windows XP Updating':'Windows XP 更新中';
var n=0;setInterval(function(){n=n<95?n+Math.floor(Math.random()*3+1):95;document.getElementById('pct').textContent=n},500)</script>
</body></html>
