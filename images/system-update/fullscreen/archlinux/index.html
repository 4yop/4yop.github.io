<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arch Linux 更新中</title>
<style>*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d1117;width:100vw;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'DejaVu Sans Mono',monospace;color:#c9d1d9;overflow:hidden}
.arch-logo{width:64px;margin-bottom:28px}
.title{font-size:18px;margin-bottom:20px;font-weight:600;color:#58a6ff}
.bar-wrap{width:340px;height:4px;background:#21262d;border-radius:2px}
.bar-inner{height:100%;width:0%;background:#58a6ff;border-radius:2px;animation:prog 20s ease-in-out infinite}
@keyframes prog{0%{width:0%}45%{width:50%}80%{width:82%}100%{width:96%}}
.sub{margin-top:14px;font-size:12px;color:#8b949e}
.terminal{margin-top:12px;width:380px;height:130px;background:#161b22;border-radius:6px;padding:10px;font-size:11px;line-height:1.6;overflow:hidden;text-align:left}
.t-line{color:#7ee787}
.t-warn{color:#ffa657}
</style></head>
<body>
<svg class="arch-logo" viewBox="0 0 72 72" fill="#58a6ff"><path d="M36 4L8 20v32l28 16 28-16V20L36 4zm0 6l22 12.5v25L36 60l-22-13v-25L36 10z"/><text x="36" y="44" text-anchor="middle" font-size="20" font-weight="bold">A</text></svg>
<div class="title" id="title"></div>
<div class="bar-wrap"><div class="bar-inner"></div></div>
<div class="sub"><span id="subLabel"></span> (<span id="pct">0</span>%)</div>
<div class="terminal" id="term"></div>
<script>var lang=new URLSearchParams(window.location.search).get('lang')||'zh';
document.getElementById('title').textContent=lang==='en'?'Synchronizing package databases':'正在同步软件包数据库';
document.getElementById('subLabel').textContent=lang==='en'?'Progress':'进度';
document.title=lang==='en'?'Arch Linux Updating':'Arch Linux 更新中';
var dlLabel=lang==='en'?'Downloading':'正在下载';
var n=0,pkgs=['linux','systemd','pacman','bash','gcc','python','firefox','neovim'];var li=0;setInterval(function(){n=n<97?n+Math.floor(Math.random()*1+1):97;document.getElementById('pct').textContent=n;if(Math.random()>.55){var d=document.getElementById('term');var t='<span class=t-line>[::] '+dlLabel+' '+pkgs[li%pkgs.length]+'-'+(Math.floor(Math.random()*900)+100)+'.pkg.tar.zst ('+(Math.floor(Math.random()*800)+200)+' KiB)</span>';d.innerHTML+='<div>'+t+'</div>';li++;if(d.children.length>5)d.removeChild(d.firstChild)}},700)</script>
</body></html>
