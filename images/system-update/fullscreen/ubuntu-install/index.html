<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ubuntu 安装中</title>
<style>*{margin:0;padding:0;box-sizing:border-box}
body{background:#2c001e;width:100vw;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Ubuntu','DejaVu Sans',sans-serif;color:#fff;overflow:hidden}
.ubu-logo{width:72px;margin-bottom:32px}
.ubu-logo svg{display:block;width:100%;height:auto}
.title{font-size:18px;margin-bottom:20px;font-weight:300}
.bar-wrap{width:320px;height:6px;background:#5a002a;border-radius:3px}
.bar-inner{height:100%;width:0%;background:#dd4814;border-radius:3px;animation:prog 16s ease-in-out infinite}
@keyframes prog{0%{width:0%}50%{width:60%}100%{width:95%}}
.sub{margin-top:14px;font-size:12px;color:#ff8866}
.lines{margin-top:10px;font-family:'Ubuntu Mono',monospace;font-size:11px;color:#cc7755;text-align:left;width:360px;line-height:1.6;height:120px;overflow:hidden}
</style></head>
<body>
<div class="ubu-logo">
<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <circle cx="16" cy="16" r="15" fill="#dd4814"/>
  <g fill="#fff">
    <circle cx="16" cy="7" r="3"/>
    <circle cx="8" cy="12" r="3"/>
    <circle cx="24" cy="12" r="3"/>
    <path d="M16 10 Q13 13 9 12 M16 10 Q19 13 23 12" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M10 14 Q12 18 16 19 M22 14 Q20 18 16 19" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <circle cx="16" cy="21" r="2.5"/>
    <path d="M16 23.5 L16 28" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M8 14.5 L5 18" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M24 14.5 L27 18" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
</div>
<div class="title" id="title"></div>
<div class="bar-wrap"><div class="bar-inner"></div></div>
<div class="sub"><span id="subLabel"></span> (<span id="pct">0</span>%)</div>
<div class="lines" id="lines"></div>
<script>var lang=new URLSearchParams(window.location.search).get('lang')||'zh';
document.getElementById('title').textContent=lang==='en'?'Installing Ubuntu — Do not turn off the power':'正在安装 Ubuntu — 请勿关闭电源';
document.getElementById('subLabel').textContent=lang==='en'?'Installation progress':'安装进度';
document.title=lang==='en'?'Ubuntu Installing':'Ubuntu 安装中';
var n=0,pkgs=['linux-image-generic','ubuntu-desktop','python3-apt','gnome-shell','snapd','firefox','libssl1.1','grub-pc'];var li=0;setInterval(function(){n=n<98?n+Math.floor(Math.random()*1+1):98;document.getElementById('pct').textContent=n;if(Math.random()>.55){var d=document.getElementById('lines');var t=(lang==='en'?'Setting up ':'正在设置 ')+pkgs[li%pkgs.length]+' ('+(Math.floor(Math.random()*900)+100)+'kB) ...';d.innerHTML+='<div>'+t+'</div>';li++;if(d.children.length>6)d.removeChild(d.firstChild)}},650)</script>
</body></html>
