<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Windows 7 更新中</title>
<style>*{margin:0;padding:0;box-sizing:border-box}
body{background:#004080;width:100vw;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Segoe UI','Microsoft YaHei',sans-serif;color:#fff;overflow:hidden}
.win-logo{width:80px;margin-bottom:40px}
.title{font-size:20px;margin-bottom:24px;font-weight:400}
.bar-wrap{width:340px;height:6px;background:#1a5a9a;border-radius:3px}
.bar-inner{height:100%;width:0%;background:#4a9ae8;border-radius:3px;animation:prog 12s ease-in-out infinite}
@keyframes prog{0%{width:0%}50%{width:65%}100%{width:94%}}
.sub{margin-top:14px;font-size:13px;color:#99ccff}
</style></head>
<body>
<svg class="win-logo" viewBox="0 0 88 88" fill="#fff"><path d="M42 10L14 16v30l28 4V10zm2 0v41l30-4V17L44 10zM14 48l28 4v27L14 72V48zm30 4l30-5v26L44 79V52z"/></svg>

<div class="bar-wrap"><div class="bar-inner"></div></div>
<div class="sub">请勿关闭计算机</div>
</body></html>
