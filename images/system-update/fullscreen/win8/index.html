<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Windows 8 更新中</title>
<style>*{margin:0;padding:0;box-sizing:border-box}
body{background:#0078d7;width:100vw;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Segoe UI',sans-serif;color:#fff;overflow:hidden}
.win-logo{width:70px;margin-bottom:36px}
.title{font-size:20px;margin-bottom:22px;font-weight:300}
.bar-wrap{width:340px;height:4px;background:#1a6ab5;border-radius:2px}
.bar-inner{height:100%;width:0%;background:#fff;border-radius:2px;animation:prog 10s ease-in-out infinite}
@keyframes prog{0%{width:0%}50%{width:67%}100%{width:93%}}
.sub{margin-top:14px;font-size:13px;color:#aaddff}
</style></head>
<body>
<svg class="win-logo" viewBox="0 0 88 88" fill="#fff"><path d="M42 10L14 16v30l28 4V10zm2 0v41l30-4V17L44 10zM14 48l28 4v27L14 72V48zm30 4l30-5v26L44 79V52z"/></svg>
<div class="title" id="title"></div>
<div class="bar-wrap"><div class="bar-inner"></div></div>
<div class="sub" id="sub"></div>
<script>var lang=new URLSearchParams(window.location.search).get('lang')||'zh';
document.getElementById('title').textContent=lang==='en'?'Updating — Do not turn off':'正在更新 — 请勿关闭';
document.getElementById('sub').textContent=lang==='en'?'Applying changes...':'正在应用更改...';
document.title=lang==='en'?'Windows 8 Updating':'Windows 8 更新中';</script>
</body></html>
