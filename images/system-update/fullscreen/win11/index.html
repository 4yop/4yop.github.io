<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Windows 10</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000000;
            font-family: Segoe UI;
            width: 100vw;
            height: 100vh;
            color: #fff;
            user-select: none;
            -moz-user-select: none;
            -webkit-user-select: none;
            -ms-user-select: none;
            position: fixed;
            text-align: center;
            cursor: none;
        }
        h1 {
            font-size: 48px;
            font-weight: normal;
            font-family: Segoe UI Light, Segoe UI;
            padding: 0;
            margin-top: 0;
        }
        .center {
            position: absolute;
            width: 500px;
            height: 450px;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }
        #bottom {
            position: fixed;
            bottom: 3%;
            width: 100%;
        }
        .loader {
            position: relative;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 200px;
            border-radius: 50%;
            margin-top: 100px;
            background: conic-gradient(#177dcf 0% 0%, #7b7b7b 0% 100%);
        }
        .loader::after {
            content: '';
            position: absolute;
            top: 3px;
            left: 3px;
            right: 3px;
            bottom: 3px;
            border-radius: 50%;
            background: #000000;
            z-index: 10;
            color: #fff;
        }
        .percentage {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 60px;
            color: #fff;
            z-index: 20;
        }
    </style>
</head>
<body>
    <div class="center">
        <h1>正在安装 Windows 10</h1>
        <p style="color:#afafaf;">您的电脑将重新启动多次，请坐下来放松片刻</p>
        <div class="loader" id="loader" style="background: conic-gradient(rgb(23, 125, 207) 0%, rgb(23, 125, 207) 10%, rgb(123, 123, 123) 0%, rgb(123, 123, 123) 100%);">
            <div class="percentage" id="timer">10%</div>
        </div>
    </div>
    <p id="bottom">
        <span style="color:#afafaf">正在复制文件</span>
        &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;
        <span style="color:#177dcf">正在安装功能和驱动 <a id="timer2">10%</a></span>
        &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;
        <span style="color:#afafaf">正在配置设置</span>
    </p>

    <script>
        var count = 0;
        var counter = setInterval(timer, 4000);

        function timer() {
            count = count + 1;
            if (count > 100) {
                count = 1;
            }
            if (count <= 0) {
                clearInterval(counter);
                return;
            }

            document.getElementById('timer').innerHTML = count + '%';
            document.getElementById('timer2').innerHTML = count + '%';

            const loader = document.getElementById('loader');
            loader.style.background = 'conic-gradient(#177dcf ' + count + '%, #7b7b7b 0% 100%)';
        }

        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });

        if (window === top.window) {
            window.location.href = '/';
        }
    </script>
</body>
</html>
